<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Plataforma de Soporte Técnico</title>
    
    <!-- Estilos Premium integrados de forma local (No requieren descargas de internet) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020617; /* Slate 950 profundo */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: screen;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Luces Neón de Fondo */
        .glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: rgba(37, 99, 235, 0.15);
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
        }

        .glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: rgba(6, 182, 212, 0.15);
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
        }

        /* Tarjeta con efecto de cristal de alta tecnología */
        .card {
            background: rgba(15, 23, 42, 0.7); /* Slate 900 con transparencia */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(51, 65, 85, 0.8);
            position: relative;
            z-index: 10;
            transition: border 0.3s ease;
        }

        .card:hover {
            border-color: rgba(37, 99, 235, 0.4);
        }

        /* Encabezado */
        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            font-size: 30px;
            margin-bottom: 16px;
        }

        .center-text {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Formularios y Cajas de Texto */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 14px;
            color: #e2e8f0;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        /* Botón de acción con degradado brillante */
        button {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            border: none;
            padding: 16px;
            color: white;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Enlace de registro inferior */
        .footer-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(51, 65, 85, 0.4);
            font-size: 14px;
            color: #94a3b8;
        }

        .footer-link a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
            transition: color 0.2s ease;
        }

        .footer-link a:hover {
            color: #22d3ee;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Capas decorativas de luces de fondo -->
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <!-- Contenedor premium -->
    <div class="card">
        
        <!-- Encabezado -->
        <div class="center-text">
            <div class="header-icon">💻</div>
            <h2>¡Bienvenido de Nuevo!</h2>
            <p class="subtitle">Laboratorio de Soporte - SENATIC</p>
        </div>

        <!-- Formulario que ejecuta el inicio de sesión hacia el server -->
        <form action="/api/login" method="POST">
            
            <!-- Campo Correo -->
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" name="correo" required placeholder="ejemplo@correo.com">
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="contrasena" required placeholder="••••••••">
            </div>

            <!-- Botón -->
            <button type="submit">Ingresar al Laboratorio</button>
        </form>

        <!-- Navegación inferior -->
        <div class="footer-link">
            ¿No tienes una cuenta aún? 
            <a href="registro.html">Regístrate aquí</a>
        </div>
    </div>

</body>
</html>
